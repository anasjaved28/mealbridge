<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="warm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#mb-grad)" />
  <!-- Inner circular badge -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" opacity="0.12" />
  <!-- Bowl Base -->
  <path d="M128 272 C 128 360, 192 408, 256 408 C 320 408, 384 360, 384 272 Z" fill="#ffffff" />
  <!-- Bowl Rim -->
  <ellipse cx="256" cy="272" rx="136" ry="24" fill="#f1f5f9" />
  <ellipse cx="256" cy="272" rx="124" ry="18" fill="#e2e8f0" />
  <!-- Heart / Food Steam Rising from Bowl -->
  <path d="M256 220 C 230 180, 176 172, 176 210 C 176 244, 256 280, 256 280 C 256 280, 336 244, 336 210 C 336 172, 282 180, 256 220 Z" fill="url(#warm-grad)" />
  <!-- Steam Whisps -->
  <path d="M208 150 Q 196 130 208 110" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M256 140 Q 244 115 256 95" stroke="#ef4444" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M304 150 Q 316 130 304 110" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85" />
</svg>
